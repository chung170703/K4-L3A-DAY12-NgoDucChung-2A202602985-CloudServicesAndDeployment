# BONUS — CI/CD với GitHub Actions
#
# Dây chuyền:  test ─┐
#                    ├─► deploy (chỉ push lên main, chỉ khi cả hai xanh)
#              build ─┘
#
# Secret cần đặt ở Settings → Secrets and variables → Actions:
#   RAILWAY_TOKEN  — Project Token của project day12-agent (Railway → project
#                    Settings → Tokens). Chưa đặt thì job deploy chỉ smoke test
#                    bản đang chạy, không deploy.
# Variable (không bí mật, tùy chọn):
#   PUBLIC_URL     — URL public của service, mặc định là URL trong DEPLOYMENT.md

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  PUBLIC_URL: ${{ vars.PUBLIC_URL || 'https://agent-production-7171.up.railway.app' }}

jobs:
  test:
    name: Test (CP1–CP4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # test_cp5 gọi vào bản deploy đang sống, test_bonus_cicd đọc badge của
      # chính workflow này; test mark `docker` đã có job build lo.
      - name: Run pytest
        env:
          AGENT_API_KEY: ci-dummy
          REDIS_URL: "fake://"
        run: >-
          pytest tests/ -v -m "not docker"
          --ignore=tests/test_cp5.py
          --ignore=tests/test_bonus_cicd.py

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-agent:${{ github.sha }} .

      - name: Show image size
        run: docker images day12-agent:${{ github.sha }}

      # Build được chưa đủ — image phải khởi động được và trả /health.
      - name: Smoke test container
        run: |
          docker run -d --name agent -p 8000:8000 \
            -e AGENT_API_KEY=ci-dummy -e REDIS_URL=fake:// \
            day12-agent:${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then
              echo; echo "container healthy sau ${i}s"; exit 0
            fi
            sleep 1
          done
          docker logs agent
          exit 1

  deploy:
    name: Deploy to Railway
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    # Hai lần push sát nhau không được deploy chồng lên nhau
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy token
        id: token
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Chưa có secret RAILWAY_TOKEN — bỏ qua bước deploy, chỉ smoke test bản đang chạy."
          fi

      - name: Install Railway CLI
        if: steps.token.outputs.present == 'true'
        run: npm install -g @railway/cli@5.62.1

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: railway up --service agent --ci

      - name: Smoke test
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "$PUBLIC_URL/health" && curl -fsS "$PUBLIC_URL/ready"; then
              echo; echo "production OK"; exit 0
            fi
            echo " — chưa sẵn sàng, thử lại sau 10s ($i/12)"
            sleep 10
          done
          exit 1
